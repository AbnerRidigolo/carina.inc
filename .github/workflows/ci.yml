# CI do CARINA — roda em todo push para main e em todo pull request.
# legacy-python: testes unitários (mockados, sem credenciais externas), ruff e black.
#   Os testes `integration` (credenciais reais NIM/Groq/FalkorDB) ficam FORA do CI.
# typescript: lint, typecheck, testes unitários e build do monorepo pnpm.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  legacy-python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: legacy/python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: legacy/python/pyproject.toml

      - name: Instala dependências
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check carina tests modal_jobs

      - name: Formatação (black)
        run: black --check carina tests modal_jobs

      - name: Testes unitários
        run: pytest -m "not integration" -q

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: carina
          POSTGRES_PASSWORD: carina
          POSTGRES_DB: carina_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carina"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Ainda não usadas; test:int e test:e2e entram no job a partir da Task 4.
      TEST_DATABASE_URL: postgresql://carina:carina@localhost:5432/carina_test
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: pnpm

      - name: Instala dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Testes unitários
        run: pnpm test

      - name: Build
        run: pnpm build
