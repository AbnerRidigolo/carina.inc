# CI do CARINA — roda em todo push para main e em todo pull request:
# testes unitários (mockados, sem credenciais externas), ruff e black.
# Os testes `integration` (credenciais reais NIM/Groq/FalkorDB) ficam
# FORA do CI de propósito — rodam localmente com .env preenchido.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instala dependências
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check carina tests modal_jobs

      - name: Formatação (black)
        run: black --check carina tests modal_jobs

      - name: Testes unitários
        run: pytest -m "not integration" -q
