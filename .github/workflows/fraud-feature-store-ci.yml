# CI do subprojeto fraud-feature-store. Escopado por `paths` para não rodar
# quando só o resto do monorepo muda.
#
# Dois jobs, de propósito:
#   - lint-test: barato e rápido (ruff + black + testes unitários, sem Redis).
#   - e2e: sobe um Redis de verdade e roda o pipeline COMPLETO em escala pequena.
#     É a prova de que offline -> apply -> materialize -> train -> online funciona
#     de ponta a ponta, não só em teoria.
name: Fraud Feature Store CI

on:
  push:
    branches: [main]
    paths:
      - "fraud-feature-store/**"
      - ".github/workflows/fraud-feature-store-ci.yml"
  pull_request:
    paths:
      - "fraud-feature-store/**"
      - ".github/workflows/fraud-feature-store-ci.yml"

defaults:
  run:
    working-directory: fraud-feature-store

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: fraud-feature-store/pyproject.toml
      - name: Instala dependências
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests feature_repo
      - name: Formatação (black)
        run: black --check src tests feature_repo
      - name: Testes unitários
        run: pytest -q

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_CONNECTION_STRING: localhost:6379
      # Escala pequena para o CI rodar rápido.
      FRAUD_FS_N_CUSTOMERS: "40"
      FRAUD_FS_N_DAYS: "20"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: fraud-feature-store/pyproject.toml
      - name: Instala dependências
        run: pip install -e .
      - name: Pipeline end-to-end (gera -> materializa -> treina -> infere)
        run: bash scripts/run_pipeline.sh
