# nginx do frontend (imagem nginx-unprivileged, sem root). SPA servida de /usr/share/nginx/html;
# `/api` e `/ws` vão para a API (serviço `api` do compose). O `api` é resolvido na subida do nginx:
# o compose só inicia o web depois de a API estar saudável.

# Upgrade só quando o cliente pede (WebSocket); sem isso a conexão ao upstream fecha normalmente.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;

    # Cabeçalhos de segurança (nenhum location abaixo usa add_header, então valem para todos).
    # connect-src: mesma origem, inclusive o WebSocket do chat (ws:/wss: para navegadores que não
    # tratam 'self' como cobrindo o esquema ws).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    # REST. O chat sem streaming pode levar dezenas de segundos (agentes + LLM).
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # WebSocket do chat: `/ws/chat?ticket=<ticket>`. Sem access_log: a URL carrega o ticket
    # (uso único, 30 s), que não deve ficar em log mesmo assim.
    location /ws/ {
        access_log off;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A API fecha por ociosidade (10 min) e por vida máxima (30 min); o proxy não corta antes.
        proxy_read_timeout 3700s;
        proxy_send_timeout 3700s;
    }

    # Arquivos com hash no nome: cache longo.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
