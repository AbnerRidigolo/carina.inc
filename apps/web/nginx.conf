# nginx do frontend (imagem nginx-unprivileged, sem root). SPA servida de /usr/share/nginx/html;
# `/api` e `/ws` vão para a API (serviço `api` do compose).
#
# O nome `api` é resolvido em tempo de requisição pelo DNS embutido do Docker (127.0.0.11), com
# cache curto: um `api` recriado (IP novo) volta a ser alcançado sem reiniciar o web. Para isso o
# proxy_pass usa uma variável; sem URI no proxy_pass, a URI original (com a query) segue igual.

# Upgrade só quando o cliente pede (WebSocket); sem isso a conexão ao upstream fecha normalmente.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# index.html nunca vai para cache (ele aponta para os assets com hash do build atual); o resto
# não recebe Cache-Control daqui (valor vazio = cabeçalho omitido). Por $uri: o fallback da SPA
# (try_files … /index.html) e o `/` já chegam aqui como /index.html.
map $uri $cache_control {
    /index.html "no-cache";
    default     "";
}

server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:3000;

    # Cabeçalhos de segurança (nenhum location abaixo usa add_header, então valem para todos).
    # connect-src 'self': pela CSP Level 3, 'self' cobre o ws:/wss: da mesma origem (o WebSocket do
    # chat em /ws/chat); nenhum outro destino de rede é permitido.
    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    # REST. O chat sem streaming pode levar dezenas de segundos (agentes + LLM).
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # WebSocket do chat: `/ws/chat?ticket=<ticket>`. Sem access_log: a URL carrega o ticket
    # (uso único, 30 s), que não deve ficar em log mesmo assim.
    location /ws/ {
        access_log off;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A API fecha por ociosidade (10 min) e por vida máxima (30 min); o proxy não corta antes.
        proxy_read_timeout 3700s;
        proxy_send_timeout 3700s;
    }

    # Arquivos com hash no nome: cache longo.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
