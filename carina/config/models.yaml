# ─────────────────────────────────────────────────────────────────────────────
# Roteamento de modelos do CARINA — TROCA DE MODELO É AQUI, NUNCA NO CÓDIGO.
#
# Os nomes de modelo são strings LiteLLM (prefixo do provedor decide a rota):
#   openrouter/<modelo>   → OpenRouter   (primário — OPENROUTER_API_KEY)
#   groq/<modelo>         → Groq         (fallback)
#   nvidia_nim/<modelo>   → NVIDIA NIM   (embeddings; opcional para inferência)
#
# ⚠️ Modelos :free do OpenRouter têm rate limit baixo (≈20 req/min) e podem ser
#    removidos com pouco aviso. Mantenha SEMPRE em config, nunca no código.
# ─────────────────────────────────────────────────────────────────────────────

roles:
  # Agentes conversacionais: Navigator, Researcher, Insight, Monitor, Assessor Liaison.
  conversational:
    primary: "openrouter/openai/gpt-oss-120b:free"
    fallback:
      - "groq/llama-3.3-70b-versatile"

  # Agentes de raciocínio (saídas estruturadas/JSON): Strategist, Predictor,
  # Risk, Tax, Executor. gpt-oss-120b é MoE de high-reasoning — serve aos dois papéis.
  reasoning:
    primary: "openrouter/openai/gpt-oss-120b:free"
    fallback:
      - "groq/llama-3.3-70b-versatile"

  # Embeddings via NeMo Retriever (1024 dims) — OpenRouter NÃO oferece embeddings,
  # então este papel continua na NVIDIA (NVIDIA_API_KEY segue necessária para o
  # GraphRAG). SEM fallback → cachear agressivamente.
  embeddings:
    primary: "nvidia/nv-embedqa-e5-v5"
    dimensions: 1024
    fallback: null

# Parâmetros gerais de chamada (LiteLLM).
litellm:
  rpm: 20            # free tier do OpenRouter (modelos :free)
  timeout: 60        # segundos
  max_retries: 2     # retries dentro do MESMO provedor antes de cair para o fallback
  temperature: 0.2
