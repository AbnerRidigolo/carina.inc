# ─────────────────────────────────────────────────────────────────────────────
# Roteamento de modelos do CARINA — TROCA DE MODELO É AQUI, NUNCA NO CÓDIGO.
#
# Os nomes de modelo são strings LiteLLM (prefixo do provedor decide a rota):
#   nvidia_nim/<modelo>   → NVIDIA NIM   (api_base/api_key injetados via env)
#   groq/<modelo>         → Groq         (fallback)
#
# ⚠️ Modelos free do NIM podem ser removidos com pouco aviso. Mantenha SEMPRE em
#    config. Os IDs abaixo são placeholders plausíveis — CONFIRMAR na sua conta NIM.
# ─────────────────────────────────────────────────────────────────────────────

roles:
  # Agentes conversacionais: Navigator, Researcher, Insight, Monitor, Assessor Liaison.
  conversational:
    primary: "nvidia_nim/meta/llama-3.3-70b-instruct"   # TODO confirmar nome exato na NIM
    fallback:
      - "groq/llama-3.3-70b-versatile"

  # Agentes de raciocínio (Hermes <think>): Strategist, Predictor, Risk, Tax, Executor.
  # Forte aderência a JSON/schema/tool-use → usar para saídas estruturadas.
  reasoning:
    primary: "nvidia_nim/nousresearch/hermes-4-70b"      # TODO confirmar nome exato (Hermes 4.x na NIM)
    fallback:
      - "nvidia_nim/meta/llama-3.3-70b-instruct"          # TODO confirmar
      - "groq/llama-3.3-70b-versatile"

  # Embeddings via NeMo Retriever (1024 dims). SEM fallback → cachear agressivamente.
  embeddings:
    primary: "nvidia/nv-embedqa-e5-v5"
    dimensions: 1024
    fallback: null

# Parâmetros gerais de chamada (LiteLLM).
litellm:
  rpm: 40            # free tier do NIM
  timeout: 60        # segundos
  max_retries: 2     # retries dentro do MESMO provedor antes de cair para o fallback
  temperature: 0.2
