packages:
  - "packages/*"
  - "apps/*"

peerDependencyRules:
  allowedVersions:
    # nestjs-zod ainda declara peer apenas ate @nestjs/common 11; funciona com 12.
    "nestjs-zod>@nestjs/common": "12"

# Scripts de instalação permitidos (pnpm 10 bloqueia os demais).
# O do Prisma baixa o schema engine usado por `prisma migrate`.
onlyBuiltDependencies:
  - "@prisma/engines"
  - prisma
