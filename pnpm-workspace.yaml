packages:
  - "packages/*"
  - "apps/*"

peerDependencyRules:
  allowedVersions:
    # nestjs-zod ainda declara peer apenas ate @nestjs/common 11; funciona com 12.
    "nestjs-zod>@nestjs/common": "12"

# Scripts de instalação permitidos (pnpm 10 bloqueia os demais).
# O do Prisma baixa o schema engine usado por `prisma migrate`.
onlyBuiltDependencies:
  - "@prisma/engines"
  - prisma

overrides:
  # @langchain/langgraph 1.6.0 pede o sdk ~1.12.9; o 1.12.10 exige @langchain/core ^1.3.2 (usamos
  # 1.3.1). Fixa o patch anterior, cujo peer (^1.2.18) aceita o core instalado.
  "@langchain/langgraph-sdk": "1.12.9"
