[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carina"
version = "0.3.0"
description = "CARINA Wealth AI v3 — plataforma de gestão patrimonial autônoma multi-agente para HNWI brasileiros"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "CARINA" }]
dependencies = [
    "graphrag-sdk[litellm,pdf]>=1.0.0",
    "agentscope>=1.0.0",
    "litellm>=1.50.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "websockets>=12.0",
    "gradio>=4.40",
    "httpx>=0.27",
    "structlog>=24.1",
    "tenacity>=8.3",
]

[project.optional-dependencies]
modal = ["modal>=0.64"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "black>=24.4",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
include = ["carina*", "modal_jobs*", "frontend*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: testes que exigem credenciais reais (NIM/Groq/FalkorDB Cloud)",
]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
